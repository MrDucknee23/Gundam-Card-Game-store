services:
  # Single Web Service: Express serves both API and React frontend
  - type: web
    name: gundam-store
    runtime: node
    plan: free
    buildCommand: npm --prefix my-frontend install && npm --prefix my-frontend run build && npm --prefix my-backend install
    startCommand: npm --prefix my-backend start
    envVars:
      - key: MONGODB_URI
        scope: all
      - key: JWT_SECRET
        scope: all
      - key: GUEST_OTP_JWT_SECRET
        scope: all
      - key: CLIENT_URL
        scope: all
      - key: FRONTEND_URL
        scope: all
      - key: API_BASE_URL
        scope: all
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_EXPIRES_IN
        value: 5m
      - key: PORT
        value: 5000
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        scope: all
      - key: GOOGLE_CLIENT_SECRET
        scope: all
      - key: GOOGLE_CALLBACK_URL
        scope: all
      # Facebook OAuth
      - key: FACEBOOK_APP_ID
        scope: all
      - key: FACEBOOK_APP_SECRET
        scope: all
      - key: FACEBOOK_CALLBACK_URL
        scope: all
      # Email configuration
      - key: EMAIL_FROM
        scope: all
      - key: EMAIL_USER
        scope: all
      - key: EMAIL_PASS
        scope: all

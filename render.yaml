services:
  # Backend Web Service
  - type: web
    name: gundam-store-backend
    runtime: node
    plan: free
    buildCommand: cd my-backend && npm install
    startCommand: cd my-backend && npm start
    envVars:
      - key: MONGODB_URI
        scope: all
      - key: JWT_SECRET
        scope: all
      - key: GUEST_OTP_JWT_SECRET
        scope: all
      - key: CLIENT_URL
        scope: all
      - key: API_BASE_URL
        scope: all
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_EXPIRES_IN
        value: 5m
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        scope: all
      - key: GOOGLE_CLIENT_SECRET
        scope: all
      - key: GOOGLE_CALLBACK_URL
        scope: all
      # Facebook OAuth
      - key: FACEBOOK_APP_ID
        scope: all
      - key: FACEBOOK_APP_SECRET
        scope: all
      - key: FACEBOOK_CALLBACK_URL
        scope: all
      # Email configuration (if needed)
      - key: MAIL_HOST
        scope: all
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_FROM
        scope: all
      - key: MAIL_USER
        scope: all
      - key: MAIL_PASS
        scope: all

  # Frontend Static Site
  - type: static
    name: gundam-store-frontend
    plan: free
    buildCommand: cd my-frontend && npm install && npm run build
    staticPublishPath: ./my-frontend/dist
    routes:
      - path: /*
        destination: /index.html
